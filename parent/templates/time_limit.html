{% extends 'parent_base.html' %}{% block content %}<h2>Screen time</h2><form class="parent-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="child_id" value="{{child_id}}"><div class="field"><label>Daily limit (minutes)</label><input type="number" min="1" max="1440" name="daily_limit" value="{{limit.daily_limit_minutes if limit else 60}}"></div><label><input type="checkbox" name="strict_mode" {% if limit and limit.strict_mode %}checked{% endif %}> Lock LittleNet when limit is reached</label><br><br><button class="btn primary">Save</button></form>{% endblock %}
