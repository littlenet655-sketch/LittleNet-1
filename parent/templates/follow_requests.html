{% extends 'parent_base.html' %}{% block content %}<h2>Connection approvals</h2>{% for p in pending %}<div class="parent-card"><b>{{p.requester_name}}</b> wants to connect with {{p.target_name}}<form method="post" action="/parent/follow-action/"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="child_id" value="{{p.child_id}}"><input type="hidden" name="target_id" value="{{p.following_child_id}}"><button class="btn primary" name="action" value="approve">Approve</button><button class="btn" name="action" value="reject">Reject</button></form></div>{% else %}<p>No pending requests.</p>{% endfor %}{% endblock %}
