{% extends 'parent_base.html' %}{% block content %}<h2>Approve interests & goals</h2><form method="post" class="parent-card"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="child_id" value="{{child_id}}"><h3>Skills</h3>{% for x in skills %}<label><input type="checkbox" name="child_skills" value="{{x.skill_id}}" {% if x.approved %}checked{% endif %}> {{x.skill_name}}</label><br>{% endfor %}<h3>Interests</h3>{% for x in interests %}<label><input type="checkbox" name="child_interests" value="{{x.interest_id}}" {% if x.approved %}checked{% endif %}> {{x.interest_name}}</label><br>{% endfor %}<h3>Ambitions</h3>{% for x in ambitions %}<label><input type="checkbox" name="child_ambitions" value="{{x.ambition_id}}" {% if x.approved %}checked{% endif %}> {{x.ambition_name}}</label><br>{% endfor %}<br><button class="btn primary">Save approvals</button></form>{% endblock %}
