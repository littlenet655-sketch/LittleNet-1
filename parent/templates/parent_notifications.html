{% extends 'parent_base.html' %}{% block content %}<div style="display:flex;align-items:center;justify-content:space-between"><h2>Alerts</h2><form method="post" action="/parent/notifications/read/"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn">Mark all read</button></form></div>{% for n in items %}<div class="parent-card {% if not n.is_read %}notification-unread{% endif %}"><b>{{n.notification_type}}</b><p>{{n.notification_message}}</p>{% if n.target_url %}<a href="{{n.target_url}}">Open</a>{% endif %}</div>{% else %}<p>No alerts.</p>{% endfor %}{% endblock %}
