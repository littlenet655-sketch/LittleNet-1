<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Multi-stop Instagram Sunset/Cyber Gradient -->
    <linearGradient id="ig-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Dark squircle container with glossy edge -->
  <rect width="64" height="64" rx="16" fill="url(#bg-dark)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Outer glowing shield outline -->
  <path d="M32 10 C42 10 49 14 51 18 C51 35 41 47 32 54 C23 47 13 35 13 18 C15 14 22 10 32 10 Z" 
        fill="none" stroke="url(#ig-shield)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Inner cyber shield fill -->
  <path d="M32 14 C40 14 45 17 47 20 C47 34 39 44 32 50 C25 44 17 34 17 20 C19 17 24 14 32 14 Z" 
        fill="url(#ig-shield)" opacity="0.22"/>
        
  <!-- Center 4-point AI Star & Safety Sparkle -->
  <path d="M32 20 L34.5 28.5 L43 31 L34.5 33.5 L32 42 L29.5 33.5 L21 31 L29.5 28.5 Z" 
        fill="#FFFFFF"/>
  <circle cx="32" cy="31" r="2.5" fill="#F43F5E"/>
</svg>
