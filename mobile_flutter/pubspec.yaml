name: littlenet_native
description: Native Flutter client for LittleNet child-safe social and learning platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  intl: ^0.19.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  tflite_flutter: ^0.12.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
