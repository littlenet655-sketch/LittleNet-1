{% extends 'base.html' %}{% block content %}<div class="form-card"><h2>Edit profile</h2>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for n,l in [('full_name','Full name'),('school_name','School'),('location','Location'),('current_class','Class')] %}<div class="field"><label>{{l}}</label><input name="{{n}}" value="{{profile[n] or ''}}"></div>{% endfor %}<div class="field"><label>Bio</label><textarea name="bio">{{profile.bio or ''}}</textarea></div><button class="btn primary">Save</button></form></div>{% endblock %}
