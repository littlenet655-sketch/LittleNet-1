name: LittleNet Real PostgreSQL Role E2E

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: littlenet
          POSTGRES_DB: safeconnect_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safeconnect_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:littlenet@127.0.0.1:5432/safeconnect_db?sslmode=disable
      BASE_URL: http://127.0.0.1:5000
      COOKIE_SECURE: '0'
      RUN_REAL_POSTGRES_E2E: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      AI_SERVICE_URL: ''
      DBMATE_MIGRATIONS_DIR: db/migrations
      DBMATE_NO_DUMP_SCHEMA: 'true'
      DBMATE_STRICT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/download/v2.34.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      - name: Build disposable LittleNet schema and production migrations
        env:
          PGPASSWORD: littlenet
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d safeconnect_db -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h 127.0.0.1 -U postgres -d safeconnect_db -v ON_ERROR_STOP=1 -f database/upgrade.sql
          psql -h 127.0.0.1 -U postgres -d safeconnect_db -v ON_ERROR_STOP=1 -f database/friendship_upgrade.sql
          dbmate --no-dump-schema --migrations-dir db/migrations up
          dbmate --no-dump-schema --migrations-dir db/migrations status
      - name: Run authenticated Kid Parent Admin smoke
        run: python -m pytest tests/test_real_postgres_role_smoke.py tests/test_mobile_authenticated_social_e2e.py -q -rs
