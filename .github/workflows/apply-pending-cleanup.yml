name: Apply LittleNet Pending Cleanup 1-3

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/complete_repository_cleanup.py'
      - '.github/workflows/apply-pending-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded repository cleanup
        run: python tools/complete_repository_cleanup.py

      - name: Verify Python syntax
        run: |
          python -m py_compile \
            auth/service.py \
            auth/routes.py \
            tools/package_release.py \
            tools/readiness.py \
            tools/seed_demo_accounts.py \
            tests/test_guardian_verification_fail_closed.py \
            tests/test_release_package_contract.py

      - name: Run cleanup regression contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_guardian_verification_fail_closed.py \
            tests/test_release_package_contract.py

      - name: Verify clean package contains no APK
        run: |
          python tools/package_release.py
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('../LittleNet-complete-release.zip')
          if not archive.is_file():
              raise SystemExit('release archive not created')
          with zipfile.ZipFile(archive) as z:
              apks = [n for n in z.namelist() if n.lower().endswith('.apk')]
          if apks:
              raise SystemExit(f'APK files leaked into source package: {apks}')
          print('Release ZIP APK exclusion: PASS')
          PY
          git diff --check

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Cleanup already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete pending cleanup: guardian gate, APK retirement, current docs'
          git push origin HEAD:main
