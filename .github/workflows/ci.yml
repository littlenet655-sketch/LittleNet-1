name: LittleNet CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install source-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local source audits
        run: python tools/audit_all.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit web/runtime dependencies
        run: pip-audit -r requirements-core.txt --progress-spinner off
      - name: Bandit application scan
        run: >-
          bandit -r admin auth child childMessage parent quiz safety services uploadPost
          -x tests
          -ll
