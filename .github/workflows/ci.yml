name: LittleNet CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install source-audit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local source audits
        run: python tools/audit_all.py
      - name: Enforce parameterized SQL identifiers
        run: python tools/audit_dynamic_sql.py
      - name: Run LittleNet Python regression suite
        run: python -m pytest tests -q
      - name: Verify pinned MediaPipe liveness assets from real upstream packages
        run: |
          python tools/install_mediapipe_assets.py
          test -s static/vendor/mediapipe/vision_bundle.mjs
          test -s static/vendor/mediapipe/face_landmarker.task
          find static/vendor/mediapipe/wasm -name '*.wasm' -type f -size +100k | grep -q .
          grep -q 'package_sha256=ee318eaa3d42230aa10910d114faf2a488c577c4e4d33c7cb04126924aca505f' static/vendor/mediapipe/BUILD-MANIFEST.txt
          grep -q 'face_landmarker_sha256=64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff' static/vendor/mediapipe/BUILD-MANIFEST.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit web/runtime dependencies
        run: pip-audit -r requirements-core.txt --progress-spinner off
      - name: Bandit application scan
        run: >-
          bandit -r admin auth child childMessage parent quiz safety services uploadPost
          -x tests
          -ll
          -s B608
