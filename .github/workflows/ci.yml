name: LittleNet CI

on:
  push:
    branches: [main, master, react-native-migration]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://littlenet:littlenet@localhost:5432/littlenet_test
      APP_TIMEZONE: Asia/Kolkata
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: littlenet
          POSTGRES_PASSWORD: littlenet
          POSTGRES_DB: littlenet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd \"pg_isready -U littlenet -d littlenet_test\"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install source-audit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest
      - name: Initialize PostgreSQL test database
        run: python tools/init_db.py
      - name: Run migration-critical backend tests
        run: python -m pytest -q tests/test_react_native_contract.py tests/test_phase2_upload_and_tags.py tests/test_ai_hardening.py tests/test_ai_safety_contract.py
      - name: Run local source audits
        run: python tools/audit_all.py
      - name: Enforce parameterized SQL identifiers
        run: python tools/audit_dynamic_sql.py
      - name: Verify pinned MediaPipe assets
        run: |
          python tools/install_mediapipe_assets.py
          test -s static/vendor/mediapipe/vision_bundle.mjs
          test -s static/vendor/mediapipe/face_landmarker.task
          find static/vendor/mediapipe/wasm -name '*.wasm' -type f -size +100k | grep -q .

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit web/runtime dependencies
        run: pip-audit -r requirements-core.txt --progress-spinner off
      - name: Bandit application scan
        run: >-
          bandit -r admin auth child childMessage parent quiz safety services uploadPost mobile
          -x tests
          -ll
          -s B608
