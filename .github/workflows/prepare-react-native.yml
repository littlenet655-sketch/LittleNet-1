name: Prepare React Native Replit Branch

on:
  push:
    branches: [react-native-migration]
    paths:
      - 'tools/prepare_replit_react_native.py'
      - '.github/workflows/prepare-react-native.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: react-native-migration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Prepare single React Native/Expo repository
        run: python tools/prepare_replit_react_native.py

      - name: Install mobile dependencies and create lockfile
        working-directory: mobile_app
        run: npm install

      - name: Type-check mobile app
        working-directory: mobile_app
        run: npm run typecheck

      - name: Export Android bundle
        working-directory: mobile_app
        run: npm run export:android

      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest

      - name: Run complete source audit
        run: python tools/audit_all.py

      - name: Run dynamic SQL audit
        run: python tools/audit_dynamic_sql.py

      - name: Commit prepared migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: replace legacy mobile client with React Native Expo"
          git push origin HEAD:react-native-migration

# git-data-trigger
