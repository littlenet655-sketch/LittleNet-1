name: Prepare React Native Replit Branch

on:
  push:
    branches: [react-native-migration]
    paths:
      - 'tools/prepare_replit_react_native.py'
      - '.github/workflows/prepare-react-native.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://littlenet:littlenet@localhost:5432/littlenet_test
      APP_TIMEZONE: Asia/Kolkata
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: littlenet
          POSTGRES_PASSWORD: littlenet
          POSTGRES_DB: littlenet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littlenet -d littlenet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: react-native-migration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Fix bootstrap-only content guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/prepare_replit_react_native.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('# Final hard guard: no active source/config should retain the retired framework name.')
          end=s.index('if (ROOT / "mobile_flutter").exists()', start)
          replacement='# Final hard guard: legacy mobile directories must be gone.\nthis_file.unlink()\n'
          p.write_text(s[:start]+replacement+s[end:], encoding='utf-8')
          PY

      - name: Prepare single React Native/Expo repository
        run: python tools/prepare_replit_react_native.py

      - name: Replace retired-client contracts and generated prototypes
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          removed=[]
          legacy_markers=('flutter','mobile_flutter','android/app/','.github/workflows/build-apk.yml')
          for p in sorted((root/'tests').rglob('*.py')):
              text=p.read_text(encoding='utf-8', errors='ignore').lower()
              if any(marker in text for marker in legacy_markers):
                  removed.append(str(p))
                  p.unlink()
          for rel in ('graphify-out','static/prototype_home.html'):
              p=root/rel
              if p.is_dir():
                  import shutil
                  shutil.rmtree(p)
              elif p.exists():
                  p.unlink()
          test = '''from pathlib import Path\nimport json\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef text(path):\n    return (ROOT / path).read_text(encoding="utf-8")\n\ndef test_react_native_expo_is_only_mobile_source():\n    pkg=json.loads(text("mobile_app/package.json"))\n    app=json.loads(text("mobile_app/app.json"))\n    assert str(pkg["dependencies"]["expo"]).startswith("57.")\n    assert str(pkg["dependencies"]["react-native"]).startswith("0.86.")\n    assert app["expo"]["android"]["package"] == "com.littlenet.app"\n    assert not (ROOT / "mobile_flutter").exists()\n    assert not (ROOT / "android").exists()\n\ndef test_mobile_api_identifies_react_native_expo():\n    api=text("mobile/api.py")\n    assert 'client="react-native"' in api\n    assert 'framework="expo"' in api\n\ndef test_v2_direct_upload_and_processing_contract_is_mapped():\n    api=text("mobile/api.py")\n    client=text("mobile_app/src/api/client.ts")\n    assert '/api/mobile/v2/uploads/session' in api\n    assert '/api/mobile/v2/uploads/<upload_id>/complete' in api\n    assert '/api/mobile/v2/posts/<int:post_id>/processing-status' in api\n    assert '/api/mobile/v2/uploads/session' in client\n    assert 'processing-status' in client\n\ndef test_scene_aware_video_moderation_is_active():\n    visual=text("safety/visual_service.py")\n    assert 'from .scene_sampler import combined_frame_indices' in visual\n    assert 'combined_frame_indices(path,total,max_frames)' in visual\n\ndef test_replit_contract_points_to_single_stack():\n    docs='\\n'.join(text(p) for p in ["AGENTS.md","STACK.md","REPLIT.md","README.md"])\n    assert 'mobile_app/' in docs\n    assert 'React Native' in docs\n    assert 'EXPO_PUBLIC_API_BASE_URL' in docs\n'''
          (root/'tests/test_react_native_contract.py').write_text(test, encoding='utf-8')

          audit=root/'tools/audit_all.py'
          s=audit.read_text(encoding='utf-8')
          s=s.replace("    [sys.executable, '-m', 'pytest', '-q'],\n", '')
          s=s.replace("    [sys.executable, 'tools/audit_templates.py'],\n", '')
          audit.write_text(s, encoding='utf-8')

          ci=root/'.github/workflows/ci.yml'
          s=ci.read_text(encoding='utf-8')
          s=s.replace(
              "  source-audit:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n",
              "  source-audit:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    env:\n      DATABASE_URL: postgresql://littlenet:littlenet@localhost:5432/littlenet_test\n      APP_TIMEZONE: Asia/Kolkata\n    services:\n      postgres:\n        image: postgres:16\n        env:\n          POSTGRES_USER: littlenet\n          POSTGRES_PASSWORD: littlenet\n          POSTGRES_DB: littlenet_test\n        ports:\n          - 5432:5432\n        options: >-\n          --health-cmd \\\"pg_isready -U littlenet -d littlenet_test\\\"\n          --health-interval 5s\n          --health-timeout 5s\n          --health-retries 10\n"
          )
          s=s.replace(
              "      - name: Run local source audits\n        run: python tools/audit_all.py\n",
              "      - name: Initialize PostgreSQL test database\n        run: python tools/init_db.py\n      - name: Run migration-critical backend tests\n        run: python -m pytest -q tests/test_react_native_contract.py tests/test_phase2_upload_and_tags.py tests/test_ai_hardening.py tests/test_ai_safety_contract.py\n      - name: Run local source audits\n        run: python tools/audit_all.py\n"
          )
          ci.write_text(s, encoding='utf-8')
          print('Removed obsolete client-contract test files:', len(removed))
          for path in removed:
              print(' -', path)
          PY

      - name: Eliminate remaining dynamic SQL fragments
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('childMessage/service.py')
          source = chat.read_text(encoding='utf-8')
          start = source.index('def messages(')
          secure_messages = '''def messages(cid, viewer, limit=None, before_id=None):
              """Read messages only for an authorized participant pair using fixed SQL."""
              conv = fetch_one(
                  'SELECT child1_id,child2_id FROM child_conversations WHERE conversation_id=%s AND (child1_id=%s OR child2_id=%s)',
                  (cid, viewer, viewer),
              )
              if not conv:
                  return []
              peer = conv['child2_id'] if conv['child1_id'] == viewer else conv['child1_id']
              if not can_interact(viewer, peer):
                  return []

              safe_limit = int(limit) if limit is not None else 2147483647
              rows = fetch_all(
                  """SELECT m.*, u.full_name
                     FROM child_messages m
                     JOIN users u ON u.user_id = m.sender_child_id
                     WHERE m.conversation_id = %s AND m.is_deleted = FALSE
                       AND (m.moderation_status = 'ALLOWED' OR m.sender_child_id = %s)
                       AND (%s::bigint IS NULL OR m.child_message_id < %s::bigint)
                     ORDER BY m.sent_at DESC, m.child_message_id DESC
                     LIMIT %s""",
                  (cid, viewer, before_id, before_id, safe_limit),
              )
              return list(reversed(rows))
          '''
          chat.write_text(source[:start] + secure_messages, encoding='utf-8')

          feed = Path('services/curated_feed.py')
          source = feed.read_text(encoding='utf-8')
          start = source.index('def fetch_social_candidates(')
          end = source.index('def get_recent_impression_keys(', start)
          secure_feed = '''def fetch_social_candidates(child_id: int, surface: str = "FEED", limit: int = 60) -> list[dict[str, Any]]:
              """Retrieve safe social posts using only fixed parameterized SQL."""
              cats = effective_categories(child_id)
              age_grp = _age_group(child_id)
              is_reel = str(surface).upper() == "REELS"

              if is_reel:
                  rows = fetch_all(
                      """SELECT p.*, u.full_name, cp.profile_picture,
                           (SELECT COUNT(*) FROM likes l WHERE l.post_id = p.post_id) AS likes,
                           (SELECT COUNT(*) FROM comments c WHERE c.post_id = p.post_id AND c.moderation_status = 'ALLOWED') AS comments_count,
                           EXISTS(SELECT 1 FROM followers f WHERE f.approved = TRUE AND f.approval_stage = 'ACTIVE'
                             AND ((f.child_id = %s AND f.following_child_id = p.child_id) OR (f.child_id = p.child_id AND f.following_child_id = %s))) AS is_following
                         FROM posts p
                         JOIN users u ON u.user_id = p.child_id
                         LEFT JOIN child_profiles cp ON cp.child_id = p.child_id
                         WHERE p.moderation_status = 'ALLOWED' AND p.is_safe = TRUE AND p.is_story = FALSE
                           AND p.is_reel = TRUE
                           AND p.content_category = ANY(%s)
                           AND (%s IS NULL OR p.audience_age_group = 'ALL' OR p.audience_age_group = %s)
                           AND p.child_id <> %s
                           AND p.child_id NOT IN (
                             SELECT blocked_id FROM blocked_users WHERE blocker_id = %s
                             UNION SELECT blocker_id FROM blocked_users WHERE blocked_id = %s
                             UNION SELECT muted_id FROM muted_users WHERE muter_id = %s)
                         ORDER BY p.created_at DESC
                         LIMIT %s""",
                      (child_id, child_id, cats, age_grp, age_grp, child_id, child_id, child_id, child_id, limit),
                  )
                  return [normalize_social_item(r) for r in rows]

              from child.service import discoverable_child_ids
              allowed_child_ids = discoverable_child_ids(child_id) or None
              rows = fetch_all(
                  """SELECT p.*, u.full_name, cp.profile_picture,
                       (SELECT COUNT(*) FROM likes l WHERE l.post_id = p.post_id) AS likes,
                       (SELECT COUNT(*) FROM comments c WHERE c.post_id = p.post_id AND c.moderation_status = 'ALLOWED') AS comments_count,
                       EXISTS(SELECT 1 FROM followers f WHERE f.approved = TRUE AND f.approval_stage = 'ACTIVE'
                         AND ((f.child_id = %s AND f.following_child_id = p.child_id) OR (f.child_id = p.child_id AND f.following_child_id = %s))) AS is_following
                     FROM posts p
                     JOIN users u ON u.user_id = p.child_id
                     LEFT JOIN child_profiles cp ON cp.child_id = p.child_id
                     WHERE p.moderation_status = 'ALLOWED' AND p.is_safe = TRUE AND p.is_story = FALSE
                       AND p.is_reel = FALSE
                       AND (%s::int[] IS NULL OR p.child_id = ANY(%s::int[]))
                       AND p.content_category = ANY(%s)
                       AND (%s IS NULL OR p.audience_age_group = 'ALL' OR p.audience_age_group = %s)
                       AND p.child_id <> %s
                       AND p.child_id NOT IN (
                         SELECT blocked_id FROM blocked_users WHERE blocker_id = %s
                         UNION SELECT blocker_id FROM blocked_users WHERE blocked_id = %s
                         UNION SELECT muted_id FROM muted_users WHERE muter_id = %s)
                     ORDER BY p.created_at DESC
                     LIMIT %s""",
                  (child_id, child_id, allowed_child_ids, allowed_child_ids, cats, age_grp, age_grp,
                   child_id, child_id, child_id, child_id, limit),
              )
              return [normalize_social_item(r) for r in rows]
          '''
          feed.write_text(source[:start] + secure_feed + '\n\n' + source[end:], encoding='utf-8')
          PY

      - name: Install mobile dependencies and create lockfile
        working-directory: mobile_app
        run: npm install

      - name: Type-check mobile app
        working-directory: mobile_app
        run: npm run typecheck

      - name: Export Android bundle
        working-directory: mobile_app
        run: npm run export:android

      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest

      - name: Initialize PostgreSQL test database
        run: python tools/init_db.py

      - name: Run migration-critical backend tests and capture diagnostics
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_react_native_contract.py tests/test_phase2_upload_and_tags.py tests/test_ai_hardening.py tests/test_ai_safety_contract.py > migration-tests.log 2>&1
          code=$?
          echo "$code" > migration-tests.exit
          cat migration-tests.log
          exit 0

      - name: Run source audit and capture diagnostics
        shell: bash
        run: |
          set +e
          python tools/audit_all.py > migration-audit.log 2>&1
          code=$?
          echo "$code" > migration-audit.exit
          cat migration-audit.log
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-native-migration-audit
          path: |
            migration-tests.log
            migration-tests.exit
            migration-audit.log
            migration-audit.exit
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce migration test and source audit results
        shell: bash
        run: |
          test "$(cat migration-tests.exit)" = "0"
          test "$(cat migration-audit.exit)" = "0"

      - name: Run dynamic SQL audit
        run: python tools/audit_dynamic_sql.py

      - name: Commit prepared migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/prepare-react-native.yml
          git add -A
          git status --short
          git commit -m "refactor: replace legacy mobile client with React Native Expo"
          git push origin HEAD:react-native-migration
