name: Package LittleNet submission ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify clean release ZIP
        run: |
          python tools/package_release.py
          python tools/verify_release.py
          test -s ../LittleNet-complete-release.zip
      - name: Upload verified submission ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleNet-submission-ready
          path: ../LittleNet-complete-release.zip
          if-no-files-found: error
          retention-days: 14
