name: Build LittleNet classroom APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "HTTPS LittleNet backend URL"
        required: true
        type: string
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-littlenet-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: ${{ inputs.backend_url || secrets.LITTLENET_BACKEND_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate live backend
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("BACKEND_URL", "").strip()
          parsed = urlparse(value)
          host = (parsed.hostname or "").lower()
          if parsed.scheme != "https" or not host:
              raise SystemExit("BACKEND_URL must be an absolute HTTPS URL")
          if "example.com" in host or host.endswith(".invalid") or "your-littlenet-backend" in host:
              raise SystemExit("BACKEND_URL cannot be a placeholder host")
          print(f"Using HTTPS backend host: {host}")
          PY
          base="${BACKEND_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/healthz" >/dev/null
          curl --fail --silent --show-error --max-time 30 "$base/readyz" >/dev/null

      - name: Inject backend URL
        run: python tools/set_backend_url.py "$BACKEND_URL"

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Assert packaged backend is not a placeholder
        run: |
          grep -q '<string name="backend_url">https://' android/app/src/main/res/values/strings.xml
          ! grep -Eiq 'example\.com|\.invalid|YOUR-LITTLENET-BACKEND' android/app/src/main/res/values/strings.xml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleNet-classroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
