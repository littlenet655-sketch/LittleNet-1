name: Finalize React Native Migration

on:
  push:
    branches: [react-native-migration]
    paths:
      - 'tools/finalize_react_native_migration.py'
      - '.github/workflows/finalize-react-native.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://littlenet:littlenet@localhost:5432/littlenet_test
      APP_TIMEZONE: Asia/Kolkata
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: littlenet
          POSTGRES_PASSWORD: littlenet
          POSTGRES_DB: littlenet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littlenet -d littlenet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-native-migration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Prepare final repository tree
        run: python tools/finalize_react_native_migration.py

      - name: Install and validate Expo app
        working-directory: mobile_app
        run: |
          npm install
          npm run typecheck
          npm run export:android

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt "pydantic>=2,<3" pytest

      - name: Validate PostgreSQL-backed contracts
        run: |
          python tools/init_db.py
          python -m pytest -q tests/test_react_native_contract.py tests/test_phase2_upload_and_tags.py tests/test_ai_hardening.py tests/test_ai_safety_contract.py
          python tools/audit_all.py
          python tools/audit_dynamic_sql.py

      - name: Create final validated commit and upload objects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/prepare-react-native.yml
          rm -f .github/workflows/finalize-react-native.yml
          rm -f tools/finalize_react_native_migration.py
          rm -f migration-tests.log migration-tests.exit migration-audit.log migration-audit.exit
          git add -A
          git commit -m "refactor: replace legacy mobile client with React Native Expo"
          git rev-parse HEAD > /tmp/final-commit-sha.txt
          git push origin HEAD:react-native-migration || true
          cp /tmp/final-commit-sha.txt final-commit-sha.txt

      - name: Publish final commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: react-native-final-commit
          path: final-commit-sha.txt
          retention-days: 3
