name: Deploy & Validate LittleNet Live

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: "Public HTTPS LittleNet web URL"
        required: false
        type: string
      deploy_web:
        description: "Deploy the Flask web service as well as AI"
        required: true
        type: boolean
        default: true
      migrate_database:
        description: "Apply LittleNet PostgreSQL schema/upgrades before validation"
        required: true
        type: boolean
        default: true
  # This path-scoped push makes the live gate run when its release machinery is
  # changed. It intentionally avoids deploying on every ordinary application push.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-modal.yml'
      - 'modal_ai.py'
      - 'modal_web.py'
      - 'services/object_storage.py'
      - 'db/migrations/**'
      - 'tools/seed_quizzes.py'

permissions:
  contents: read

env:
  LIVE_URL: ${{ inputs.live_url || vars.LITTLENET_LIVE_URL || 'https://littlenet655--littlenet-web-web.modal.run' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.5,<2"

      - name: Verify release URL and Modal credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          u=os.environ.get('LIVE_URL','').strip().rstrip('/')
          if not u.startswith('https://') or 'YOUR-LITTLENET-BACKEND' in u or 'localhost' in u or '127.0.0.1' in u:
              sys.exit(f'LIVE_URL must be the real HTTPS LittleNet deployment, got: {u!r}')
          print('Live URL:',u)
          PY
          test -n "$MODAL_TOKEN_ID" || (echo "Missing MODAL_TOKEN_ID secret" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "Missing MODAL_TOKEN_SECRET secret" && exit 1)
          modal token info

      - name: Deploy AI service
        run: modal deploy modal_ai.py --stream-logs

      # Validate cheaper web/runtime dependencies before invoking the expensive
      # T4 model warm gate. This avoids burning GPU credits only to discover a
      # missing DB, mail, R2 or BASE_URL configuration later in the release.
      - name: Deploy web service
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        run: modal deploy modal_web.py --stream-logs

      - name: Apply database schema and migrations
        if: ${{ (github.event_name == 'push' || inputs.deploy_web) && (github.event_name == 'push' || inputs.migrate_database) }}
        run: modal run modal_web.py --init-db

      - name: Seed mandatory age-banded quiz bank
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        run: modal run modal_web.py --seed

      - name: Run DB, AI, Presidio, liveness, mail, R2 and BASE_URL preflight
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        run: modal run modal_web.py --preflight

      - name: Warm and validate every locked-scope AI model
        run: modal run modal_ai.py

      - name: Require public health and ready endpoints
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${LIVE_URL%/}"
          ok=0
          for i in $(seq 1 24); do
            if curl --connect-timeout 10 --max-time 30 -fsS "$URL/healthz" > healthz.json; then
              ok=1
              break
            fi
            echo "Waiting for public web endpoint ($i/24)..."
            sleep 10
          done
          test "$ok" = 1 || (echo "Public /healthz never became healthy" && exit 1)
          cat healthz.json
          curl --connect-timeout 10 --max-time 60 --fail-with-body -fsS "$URL/readyz" | tee readyz.json
          python - <<'PY'
          import json
          data=json.load(open('readyz.json',encoding='utf-8'))
          if data.get('status') != 'ready':
              raise SystemExit(f"Live /readyz is not ready: {data}")
          for key in ('database','ai','mail'):
              if data.get(key) is not True:
                  raise SystemExit(f"Live /readyz {key} is not true: {data}")
          print('Public readiness: PASS')
          PY

      - name: Set up Node for public browser smoke
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Run strict public browser smoke
        if: ${{ github.event_name == 'push' || inputs.deploy_web }}
        env:
          E2E_BASE_URL: ${{ env.LIVE_URL }}
          E2E_REQUIRE_READY: '1'
        run: npx playwright test tests/e2e/release-smoke.spec.js --project=chromium

      - name: Upload live release evidence
        if: ${{ always() && (github.event_name == 'push' || inputs.deploy_web) }}
        uses: actions/upload-artifact@v4
        with:
          name: littlenet-live-release-evidence
          path: |
            healthz.json
            readyz.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  live-apk:
    needs: deploy
    if: ${{ github.event_name == 'push' || inputs.deploy_web }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Inject the same verified live URL
        env:
          BACKEND_URL: ${{ env.LIVE_URL }}
        run: |
          python tools/set_backend_url.py "$BACKEND_URL"
          grep -F "$BACKEND_URL" android/app/src/main/res/values/strings.xml
          ! grep -q 'YOUR-LITTLENET-BACKEND' android/app/src/main/res/values/strings.xml

      - name: Build installable live APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and embedded backend URL
        env:
          BACKEND_URL: ${{ env.LIVE_URL }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          aapt dump badging "$APK" | grep -q "package: name='com.littlenet.app'"
          strings "$APK" | grep -F "${BACKEND_URL%/}" >/dev/null || strings "$APK" | grep -F "$BACKEND_URL" >/dev/null

      - name: Upload live APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleNet-live-verified-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
