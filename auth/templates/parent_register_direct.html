{% extends 'base.html' %}{% block content %}<div class="form-card"><h1>Parent Mode</h1><h3>Create parent account</h3>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Username</label><input name="username" required pattern="[A-Za-z0-9_.]{3,30}"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><button class="btn primary" style="width:100%">Create Parent Mode account</button></form><p class="muted">After login, Parent Mode can create and configure the child account directly.</p></div>{% endblock %}
