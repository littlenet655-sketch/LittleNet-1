{% extends 'base.html' %}{% block content %}<div class="form-card"><h1>Face Login</h1><p class="muted">Use a live, well-lit face. Printed photos/screens should be rejected.</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Child email</label><input name="email" type="email" required></div><div class="field"><label>Live selfie</label><input name="photo" type="file" accept="image/*" capture="user" required></div><button class="btn primary">Verify face</button></form><a class="auth-back" href="/login/?mode=kids">Use password login instead</a></div>{% endblock %}
