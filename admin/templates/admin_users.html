{% extends 'admin_base.html' %}{% block content %}<h2>User management</h2><form class="admin-filter" method="get"><input name="q" value="{{q}}" placeholder="Search name, email or username"><select name="role"><option value="">All roles</option>{% for x in ['CHILD','PARENT','ADMIN'] %}<option {% if role==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="status"><option value="">All states</option>{% for x in ['ACTIVE','PENDING_APPROVAL','REJECTED','SUSPENDED'] %}<option {% if status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button class="btn">Filter</button></form>{% for u in users %}<div class="parent-card"><b>{{u.full_name}}</b> · {{u.role}}<p>{{u.email}} · @{{u.username}}</p><span class="safety-chip">{{u.account_status}}</span>{% if u.role!='ADMIN' %}<form method="post" action="/admin/user/{{u.user_id}}/"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn {% if u.account_status!='SUSPENDED' %}danger{% endif %}" name="action" value="{{'ACTIVATE' if u.account_status=='SUSPENDED' else 'SUSPEND'}}">{{'Activate' if u.account_status=='SUSPENDED' else 'Suspend'}}</button></form>{% endif %}</div>{% endfor %}{% endblock %}
