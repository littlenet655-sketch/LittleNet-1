{% extends 'parent_base.html' %}{% block content %}<h2>Learning settings</h2><form class="parent-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="child_id" value="{{child_id}}"><div class="field"><label>Show mandatory quiz after content views</label><input name="quiz_frequency" type="number" min="1" max="50" value="{{settings.quiz_frequency if settings else 5}}"></div><label><input type="checkbox" name="mandatory_quiz" {% if settings and settings.mandatory_quiz %}checked{% endif %}> Mandatory learning break</label><br><br><button class="btn primary">Save</button></form>{% endblock %}
