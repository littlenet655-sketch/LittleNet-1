{% extends 'base.html' %}{% block content %}{% import '_post.html' as ui %}{{ui.post_card(post)}}<div class="form-card"><h3>Comments</h3>{% for c in comments %}<p><b>{{c.full_name}}</b> {{c.comment_text}}</p>{% endfor %}<form method="post" action="/comment/{{post.post_id}}/"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><input name="comment" placeholder="Add a comment"></div><button class="btn">Post</button></form></div>{% endblock %}
