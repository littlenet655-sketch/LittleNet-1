{% extends 'base.html' %}{% block content %}{% import '_icons.html' as ico %}
<div class="form-card create-card"><div class="create-hero"><span class="create-hero-icon">{{ico.icon('plus',28)}}</span><div><span class="eyebrow">Create safely</span><h1>{{t('create_post')}}</h1></div></div><div id="uploadStatus" class="upload-status muted" role="status"></div><form method="post" enctype="multipart/form-data" data-safe-upload><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label>{{t('post_type')}}</label><select name="kind" data-kind><option value="post">{{t('post')}}</option><option value="reel">Clip</option><option value="story">{{t('story')}}</option></select></div><div class="field"><label>{{t('media')}}</label><label class="upload-drop">{{ico.icon('camera',28)}}<b>Choose photo, video or audio</b><small>LittleNet checks it before anyone else can see it.</small><input name="media" type="file" accept="image/*,video/*,audio/*" multiple></label></div><div class="field" data-story-music><label>{{t('story_music')}}</label><input name="music_file" type="file" accept="audio/*"></div><div class="field"><label>{{t('caption')}}</label><textarea name="caption" maxlength="2200" placeholder="Say something kind..."></textarea></div><div class="field"><label>{{t('category')}}</label><select name="content_category">{% for cat in (child_effective_categories if child_controls else ['Other','Science','Math','Art','Sports','Music','Technology','Education','Nature','Books','Coding','General Knowledge']) %}<option>{{cat}}</option>{% endfor %}</select></div><div class="field"><label>{{t('age_group')}}</label><select name="audience_age_group"><option value="ALL">{{t('all_ages')}}</option><option>6-8</option><option>9-11</option><option>12-13</option><option>14-18</option></select></div><button class="btn primary big-btn" type="submit">{{ico.icon('shield',18)}} {{t('publish')}} safely</button></form><p class="moderation-note">{{ico.icon('check',16)}} {{t('moderation_note')}}</p></div>{% endblock %}
